<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simulasi Galaksi Bimasakti & Tata Surya Realistis</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI Panel Kontrol */
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 10, 25, 0.85);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            max-width: 280px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 16px;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
            color: #61dafb;
            text-transform: uppercase;
        }

        p.instruction {
            font-size: 11px;
            color: #aaa;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button:hover {
            background: rgba(97, 218, 251, 0.2);
            border-color: #61dafb;
            color: #61dafb;
            transform: translateX(3px);
        }

        button.active {
            background: rgba(97, 218, 251, 0.35);
            border-color: #61dafb;
            font-weight: bold;
        }

        /* Indikator Info Planet */
        #planet-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 10, 25, 0.85);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            display: none;
            max-width: 300px;
        }

        #planet-info h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #f39c12;
        }

        #planet-info p {
            margin: 0;
            font-size: 11px;
            color: #ccc;
            line-height: 1.3;
        }

        /* Loading Screen */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #61dafb;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loader p {
            margin-top: 15px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>MEMUAT ALAM SEMESTA...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <h1>Bimasakti & Tata Surya</h1>
        <p class="instruction">Geser untuk rotasi, Cubit/Scroll untuk Zoom. Pilih objek untuk tampilan dekat:</p>
        <div class="btn-group" id="nav-buttons">
            <button onclick="focusView('galaxy')"><span>🌌 Pandangan Galaksi</span></button>
            <button onclick="focusView('sun')"><span>☀️ Matahari</span></button>
            <button onclick="focusView('mercury')"><span>☿️ Merkurius</span></button>
            <button onclick="focusView('venus')"><span>♀️ Venus</span></button>
            <button onclick="focusView('earth')"><span>🌍 Bumi & Bulan</span></button>
            <button onclick="focusView('mars')"><span>♂️ Mars</span></button>
            <button onclick="focusView('jupiter')"><span>♃ Jupiter</span></button>
            <button onclick="focusView('saturn')"><span>♄ Saturnus</span></button>
            <button onclick="focusView('uranus')"><span>♅ Uranus</span></button>
            <button onclick="focusView('neptune')"><span>♆ Neptunus</span></button>
        </div>
    </div>

    <div id="planet-info">
        <h3 id="info-title">Nama Objek</h3>
        <p id="info-desc">Deskripsi singkat detail astronomi.</p>
    </div>

    <!-- Three.js & OrbitControls dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let galaxyParticles, solarSystemGroup;
        let celestialObjects = {};
        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let targetCameraPosition = new THREE.Vector3(0, 4000, 8000);
        let currentFocus = 'galaxy';
        let isTransitioning = false;

        const infoData = {
            galaxy: { title: "Galaksi Bimasakti", desc: "Galaksi spiral besar yang berisi lebih dari 100 miliar bintang. Tata Surya kita berada di lengan Orion." },
            sun: { title: "Matahari (Pusat Tata Surya)", desc: "Bintang deret utama tipe G yang menyuplai energi dan gravitasi bagi seluruh planet di tata surya." },
            mercury: { title: "Merkurius", desc: "Planet terkecil dan terdekat dengan Matahari. Permukaannya penuh kawah seperti bulan." },
            venus: { title: "Venus", desc: "Planet paling panas di tata surya dengan atmosfer tebal beracun dan efek rumah kaca yang ekstrem." },
            earth: { title: "Bumi", desc: "Rumah kita satu-satunya planet yang diketahui memiliki air cair dan kehidupan biologis." },
            mars: { title: "Mars (Planet Merah)", desc: "Dikenal karena tanahnya yang kaya oksida besi (karat) dan memiliki gunung berapi tertinggi di tata surya." },
            jupiter: { title: "Jupiter", desc: "Planet raksasa gas terbesar di tata surya dengan Badai Bintik Merah Raksasa yang ikonik." },
            saturn: { title: "Saturnus", desc: "Planet bercincin es megah yang spektakuler dan sangat ikonik di tata surya." },
            uranus: { title: "Uranus", desc: "Raksasa es unik yang berotasi pada sisi batangnya dengan warna biru kehijauan." },
            neptune: { title: "Neptunus", desc: "Planet terluar terjauh yang berangin sangat kencang dengan warna biru tua pekat." }
        };

        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');

            // Scene & Camera
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0001);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50000);
            camera.position.set(0, 4500, 7500);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 15000;
            controls.minDistance = 5;

            // Ambient Light & Stars Background
            const ambientLight = new THREE.AmbientLight(0x333333);
            scene.add(ambientLight);

            createStarfieldBackground();
            createMilkyWayGalaxy();
            createSolarSystemInOrionArm();

            // Event Listener
            window.addEventListener('resize', onWindowResize);

            // Hide Loader
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 800);
            }, 1000);
        }

        // Background Luar Angkasa Bintang Jauh
        function createStarfieldBackground() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 10000;
            const positions = new Float32Array(starsCount * 3);

            for (let i = 0; i < starsCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 40000;
                positions[i + 1] = (Math.random() - 0.5) * 40000;
                positions[i + 2] = (Math.random() - 0.5) * 40000;
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.5,
                transparent: true,
                opacity: 0.8
            });

            const starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);
        }

        // Pembuatan Galaksi Bimasakti Realistis (Spiral)
        function createMilkyWayGalaxy() {
            const particleCount = 120000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorInside = new THREE.Color(0xffeedd); // Inti galaksi hangat
            const colorOutside = new THREE.Color(0x3366ff); // Lengan galaksi kebiruan

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;

                // Distribusi spiral logaritmik
                const radius = Math.random() * 3500;
                const spinAngle = radius * 0.0012;
                const armOffset = ((i % 4) / 4) * Math.PI * 2;
                const randomAngle = armOffset + spinAngle + (Math.random() - 0.5) * 0.5;

                const x = Math.cos(randomAngle) * radius;
                const z = Math.sin(randomAngle) * radius;
                const y = (Math.random() - 0.5) * (300 * (1 - radius / 3500)); // Semakin ke pinggir semakin tipis

                positions[i3] = x;
                positions[i3 + 1] = y;
                positions[i3 + 2] = z;

                // Gradasi Warna
                const mixedColor = colorInside.clone();
                mixedColor.lerp(colorOutside, radius / 3500);
                
                // Inti lebih terang
                if(radius < 500) {
                    colors[i3] = 1.0;
                    colors[i3 + 1] = 0.95;
                    colors[i3 + 2] = 0.8;
                } else {
                    colors[i3] = mixedColor.r;
                    colors[i3 + 1] = mixedColor.g;
                    colors[i3 + 2] = mixedColor.b;
                }
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 2.2,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.8,
                depthWrite: false
            });

            galaxyParticles = new THREE.Points(geometry, material);
            scene.add(galaxyParticles);
        }

        // Tata Surya di Lengan Orion
        function createSolarSystemInOrionArm() {
            solarSystemGroup = new THREE.Group();
            // Letak Tata Surya di Lengan Orion (Koordinat dalam galaksi)
            solarSystemGroup.position.set(1800, 0, 500);
            scene.add(solarSystemGroup);

            // 1. Matahari
            const sunGeo = new THREE.SphereGeometry(35, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const sun = new THREE.Mesh(sunGeo, sunMat);
            solarSystemGroup.add(sun);
            celestialObjects['sun'] = { mesh: sun, distance: 0, scale: 35 };

            // Cahaya Matahari
            const sunLight = new THREE.PointLight(0xffffff, 2.5, 4000, 0.5);
            solarSystemGroup.add(sunLight);

            // Data Planet (Jarak orbit, ukuran visual diperjelas agar tampak realistis dekat)
            const planetData = [
                { id: 'mercury', name: 'Merkurius', size: 2.5, distance: 70, color: 0x888888, speed: 0.04 },
                { id: 'venus', name: 'Venus', size: 4.5, distance: 110, color: 0xe3bb76, speed: 0.015 },
                { id: 'earth', name: 'Bumi', size: 5.0, distance: 160, color: 0x2277ff, speed: 0.01 },
                { id: 'mars', name: 'Mars', size: 3.2, distance: 220, color: 0xcc4400, speed: 0.008 },
                { id: 'jupiter', name: 'Jupiter', size: 12.0, distance: 330, color: 0xd4a373, speed: 0.004 },
                { id: 'saturn', name: 'Saturnus', size: 9.5, distance: 460, color: 0xf4e2bb, speed: 0.002 },
                { id: 'uranus', name: 'Uranus', size: 6.5, distance: 580, color: 0x73d2de, speed: 0.0012 },
                { id: 'neptune', name: 'Neptunus', size: 6.2, distance: 700, color: 0x274690, speed: 0.0009 }
            ];

            planetData.forEach(data => {
                const orbitGroup = new THREE.Group();
                solarSystemGroup.add(orbitGroup);

                // Garis Orbit Tipis
                const orbitGeo = new THREE.BufferGeometry();
                const points = [];
                for (let i = 0; i <= 64; i++) {
                    const theta = (i / 64) * Math.PI * 2;
                    points.push(new THREE.Vector3(Math.cos(theta) * data.distance, 0, Math.sin(theta) * data.distance));
                }
                orbitGeo.setFromPoints(points);
                const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08 });
                const orbitLine = new THREE.Line(orbitGeo, orbitMat);
                solarSystemGroup.add(orbitLine);

                // Mesh Planet
                const planetGeo = new THREE.SphereGeometry(data.size, 32, 32);
                let planetMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.8 });
                
                // Khusus Bumi berikan nuansa sedikit mengkilap
                if(data.id === 'earth') {
                    planetMat.roughness = 0.5;
                }

                const planetMesh = new THREE.Mesh(planetGeo, planetMat);
                planetMesh.position.x = data.distance;
                orbitGroup.add(planetMesh);

                // Cincin Saturnus khusus
                if(data.id === 'saturn') {
                    const ringGeo = new THREE.RingGeometry(data.size * 1.3, data.size * 2.3, 32);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xc2b280, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    planetMesh.add(ring);
                }

                // Simpan referensi untuk animasi & kamera
                celestialObjects[data.id] = {
                    group: orbitGroup,
                    mesh: planetMesh,
                    speed: data.speed,
                    distance: data.distance,
                    scale: data.size
                };
            });
        }

        // Navigasi Fokus Tombol Kiri Atas
        function focusView(targetName) {
            currentFocus = targetName;
            isTransitioning = true;

            // Update status tombol aktif UI
            document.querySelectorAll('#nav-buttons button').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Tampilkan info panel
            const infoBox = document.getElementById('planet-info');
            const infoTitle = document.getElementById('info-title');
            const infoDesc = document.getElementById('info-desc');

            if(infoData[targetName]) {
                infoBox.style.display = 'block';
                infoTitle.innerText = infoData[targetName].title;
                infoDesc.innerText = infoData[targetName].desc;
            }

            if (targetName === 'galaxy') {
                targetLookAt.set(0, 0, 0);
                targetCameraPosition.set(0, 4500, 7500);
            } else {
                const obj = celestialObjects[targetName];
                if (obj) {
                    // Hitung posisi global objek di tata surya
                    const worldPos = new THREE.Vector3();
                    obj.mesh.getWorldPosition(worldPos);
                    targetLookAt.copy(worldPos);

                    // Jarak kamera mendekat proporsional dengan besar objek
                    const offset = obj.scale * 6 + 15;
                    targetCameraPosition.set(worldPos.x + offset, worldPos.y + offset * 0.8, worldPos.z + offset);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Loop Animasi Utama
        function animate() {
            requestAnimationFrame(animate);

            // Rotasi galaksi perlahan
            if (galaxyParticles) {
                galaxyParticles.rotation.y += 0.0004;
            }

            // Rotasi Orbit Planet Tata Surya
            for (let key in celestialObjects) {
                if (key !== 'sun' && celestialObjects[key].group) {
                    celestialObjects[key].group.rotation.y += celestialObjects[key].speed * 0.5;
                    // Rotasi diri planet
                    celestialObjects[key].mesh.rotation.y += 0.01;
                }
            }

            // Transisi halus kamera jika tombol fokus ditekan
            if (isTransitioning) {
                if(currentFocus !== 'galaxy') {
                    const obj = celestialObjects[currentFocus];
                    if(obj) {
                        const worldPos = new THREE.Vector3();
                        obj.mesh.getWorldPosition(worldPos);
                        targetLookAt.copy(worldPos);
                        const offset = obj.scale * 6 + 15;
                        targetCameraPosition.set(worldPos.x + offset, worldPos.y + offset * 0.8, worldPos.z + offset);
                    }
                }

                camera.position.lerp(targetCameraPosition, 0.05);
                controls.target.lerp(targetLookAt, 0.05);

                if (camera.position.distanceTo(targetCameraPosition) < 5) {
                    isTransitioning = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
